[workspace]
members = [
    "crates/voxui-gguf",
    "crates/voxui-inference",
    "crates/voxui-audio",
    "crates/voxui-sidecar-protocol",
    "crates/voxui-inference-sidecar",
    "crates/voxui-cli",
    "crates/voxui-desktop",
    "crates/voxui-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
candle-core = "0.8"
candle-nn = "0.8"

[profile.dev]
incremental = true
debug = 1

[profile.dev.package."*"]
opt-level = 0
debug = 0

[profile.release]
lto = false
codegen-units = 16
debug = false
strip = true
