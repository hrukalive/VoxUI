[package]
name = "voxui-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "voxui_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voxui-desktop-bin"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
voxui-inference = { path = "../../voxui-inference" }
voxui-audio = { path = "../../voxui-audio" }
voxui-sidecar-protocol = { path = "../../voxui-sidecar-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4", "serde"] }
sys-locale = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
cuda = ["voxui-inference/cuda"]
